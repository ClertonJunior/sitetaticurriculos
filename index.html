<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tati Currículos | Consultoria Profissional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            white: '#FFFFFF',
                            bg: '#F8FAFC',
                            text: '#0F172A',
                            muted: '#64748B',
                            accent: '#B45309',
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { 
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92)), url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0F172A; 
            margin: 0; 
            padding: 0; 
        }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid #E2E8F0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .card-service { background: white; border: 1px solid #E2E8F0; border-radius: 24px; transition: all 0.3s ease; cursor: pointer; height: 100%; display: flex; flex-direction: column; }
        .card-service:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border-color: #CBD5E1; }
        .modal-bg { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="font-sans antialiased">

    <header class="bg-white/80 backdrop-blur-sm pt-12 pb-8 px-6 text-center border-b border-slate-100 relative z-10">
        <div class="max-w-4xl mx-auto">
            <div class="relative inline-block mb-4">
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-full border-[6px] border-slate-50 shadow-2xl overflow-hidden bg-slate-100 mx-auto">
                    <img src="foto.jpg" 
                         class="w-full h-full object-cover scale-110" 
                         alt="Tati Currículos Logo">
                </div>
                <div class="absolute bottom-3 right-3 bg-green-500 w-6 h-6 rounded-full border-4 border-white shadow-sm"></div>
            </div>
            
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                Tati <span class="text-amber-700">Currículos</span>
            </h1>
            <p class="text-slate-500 font-medium mt-2 text-xs uppercase tracking-widest">
                Consultora de Carreira | Currículo e LinkedIn
            </p>
        </div>
    </header>

    <nav class="sticky top-0 z-40 glass py-4">
        <div class="max-w-6xl mx-auto px-6 flex gap-3 overflow-x-auto no-scrollbar">
            <button onclick="filter('Todos')" class="cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm shadow-md">Todos</button>
            <button onclick="filter('LinkedIn')" class="cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-white border border-slate-200 text-brand-muted font-bold text-sm shadow-sm">LinkedIn</button>
            <button onclick="filter('Currículos')" class="cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-white border border-slate-200 text-brand-muted font-bold text-sm shadow-sm">Currículos</button>
            <button onclick="filter('Lattes')" class="cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-white border border-slate-200 text-brand-muted font-bold text-sm shadow-sm">Lattes</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10 pb-40 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="grid-container">
            </div>
    </main>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-4 translate-y-full transition-transform duration-500 z-50">
        <div class="max-w-md mx-auto bg-white/95 backdrop-blur-sm border border-slate-200 shadow-2xl rounded-3xl p-4 flex items-center justify-between">
            <div class="pl-2">
                <p class="text-[10px] font-bold text-brand-muted uppercase tracking-tighter">Selecionado</p>
                <p id="total-val" class="font-extrabold text-xl text-brand-text">R$ 0,00</p>
            </div>
            <button onclick="openCheckout()" class="bg-brand-text text-white px-8 py-3.5 rounded-2xl font-bold hover:bg-slate-800 transition-all">Continuar</button>
        </div>
    </div>

    <div id="modal-service" class="fixed inset-0 modal-bg z-[100] hidden flex items-end justify-center">
        <div class="bg-white w-full max-h-[85vh] rounded-t-[40px] p-8 overflow-y-auto shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8 cursor-pointer" onclick="closeModal()"></div>
            <div id="modal-content" class="max-w-xl mx-auto"></div>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-white z-[110] hidden p-6 overflow-y-auto">
        <div class="max-w-lg mx-auto text-center">
            <button onclick="closeCheckout()" class="mb-10 text-brand-muted font-bold flex items-center gap-2">
                <i class="fa-solid fa-chevron-left"></i> Voltar
            </button>
            <h2 class="text-3xl font-black mb-8 text-brand-text uppercase italic">Finalizar Pedido</h2>
            <div id="checkout-items" class="mb-8"></div>
            <input type="text" id="c-name" placeholder="Seu Nome Completo" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-200 mb-4">
            <button onclick="sendWhatsApp()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-lg shadow-xl hover:bg-green-700">
                <i class="fa-brands fa-whatsapp mr-2 text-xl"></i> Solicitar no WhatsApp
            </button>
        </div>
    </div>

    <script>
        const SERVICES = [
            // LinkedIn
            { id: 101, cat: "LinkedIn", name: "LinkedIn Essencial", price: 55, desc: "Título + Sobre + 3 experiências + 10 competências + Open to work. (Sem banner e foto).", icon: "fa-linkedin-in" },
            { id: 102, cat: "LinkedIn", name: "LinkedIn Profissional", price: 75, desc: "Essencial + Banner personalizado + Otimização com palavras-chave e ajustes.", icon: "fa-linkedin-in" },
            { id: 1, cat: "LinkedIn", name: "LinkedIn Premium", price: 85, desc: "Completo + Texto de abordagem + Foto e Banner + 10 vagas mapeadas + Simulação.", icon: "fa-linkedin-in" },
            { id: 103, cat: "LinkedIn", name: "LinkedIn Premium + Currículo", price: 100, desc: "O pacote completo: LinkedIn Premium total + Currículo Vitae estratégico.", icon: "fa-id-card" },
            
            // Lattes
            { id: 11, cat: "Lattes", name: "Lattes Júnior", price: 50, desc: "Até 5 anos de experiência e 1-3 empresas.", icon: "fa-graduation-cap" },
            { id: 12, cat: "Lattes", name: "Lattes Pleno", price: 60, desc: "Até 10 anos de experiência e conquistas destacadas.", icon: "fa-graduation-cap" },
            
            // Currículos
            { id: 13, cat: "Currículos", name: "Currículo Internacional", price: 50, desc: "Adaptação para padrões estrangeiros e termos técnicos globais.", icon: "fa-earth-americas" },
            { id: 5, cat: "Currículos", name: "Profissional Superior", price: 22, desc: "Estratégico para graduados, focado em trajetória e competências.", icon: "fa-user-graduate" },
            { id: 7, cat: "Currículos", name: "Profissional Técnico", price: 20, desc: "Foco em formações técnicas e experiência prática no setor.", icon: "fa-screwdriver-wrench" },
            { id: 10, cat: "Currículos", name: "Área Comercial", price: 18, desc: "Focado em metas e resultados de vendas. (Funcional ou combinado).", icon: "fa-chart-line" },
            { id: 9, cat: "Currículos", name: "Jovem Aprendiz", price: 18, desc: "Destaque para o potencial e escolaridade do jovem.", icon: "fa-child-reaching" },
            { id: 8, cat: "Currículos", name: "Primeiro Emprego", price: 16, desc: "Para quem não possui experiência formal de trabalho.", icon: "fa-rocket" }
        ];

        let selectedProduct = null;
        const WHATSAPP_NUMBER = "5581982137991"; 

        function renderServices(list) {
            const container = document.getElementById('grid-container');
            container.innerHTML = list.map(s => `
                <div class="card-service p-8 group flex flex-col justify-between" onclick="openDetails(${s.id})">
                    <div>
                        <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center mb-6 text-brand-text group-hover:bg-slate-900 group-hover:text-white transition-all">
                            <i class="fa-solid ${s.icon} text-xl"></i>
                        </div>
                        <h3 class="text-xl font-bold mb-3 text-brand-text group-hover:text-amber-700 transition-colors">${s.name}</h3>
                        <p class="text-brand-muted text-sm leading-relaxed mb-6">${s.desc}</p>
                    </div>
                    <div class="pt-6 border-t border-slate-100 flex items-center justify-between mt-auto">
                        <span class="font-black text-brand-text text-lg">R$ ${s.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}</span>
                        <div class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-brand-muted group-hover:bg-amber-600 group-hover:border-amber-600 group-hover:text-white transition-all shadow-sm">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filter(cat) {
            const btns = document.querySelectorAll('.cat-btn');
            btns.forEach(b => {
                b.className = "cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-white border border-slate-200 text-brand-muted font-bold text-sm shadow-sm";
            });
            event.target.className = "cat-btn flex-shrink-0 px-6 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm shadow-md";
            renderServices(cat === 'Todos' ? SERVICES : SERVICES.filter(s => s.cat === cat));
        }

        function openDetails(id) {
            const s = SERVICES.find(x => x.id === id);
            selectedProduct = s;
            document.getElementById('modal-service').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-3xl font-black text-brand-text mb-4 tracking-tight">${s.name}</h2>
                <p class="text-brand-muted leading-relaxed mb-8">${s.desc}</p>
                <button onclick="confirmService()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-extrabold text-lg transition-all hover:bg-slate-800 shadow-lg shadow-slate-200">Escolher este Plano</button>
            `;
        }

        function confirmService() {
            closeModal();
            document.getElementById('cart-bar').classList.remove('translate-y-full');
            document.getElementById('total-val').innerText = `R$ ${selectedProduct.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;
        }

        function openCheckout() {
            document.getElementById('modal-checkout').classList.remove('hidden');
            document.getElementById('checkout-items').innerHTML = `
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex justify-between items-center shadow-inner">
                    <h4 class="font-black text-brand-text text-lg">${selectedProduct.name}</h4>
                    <p class="font-black text-slate-900 text-2xl">R$ ${selectedProduct.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}</p>
                </div>
            `;
        }

        function sendWhatsApp() {
            const name = document.getElementById('c-name').value;
            if(!name) return alert("Por favor, informe seu nome.");
            const msg = `*NOVO PEDIDO - TATI CURRÍCULOS*\n\nOlá Tati! Meu nome é *${name}* e gostaria do serviço:\n✅ *${selectedProduct.name}*\n💰 *Valor:* R$ ${selectedProduct.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}\n\nPode me passar os próximos passos?`;
            window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(msg)}`);
        }

        function closeModal() { document.getElementById('modal-service').classList.add('hidden'); }
        function closeCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }

        renderServices(SERVICES);
    </script>
</body>
</html>
